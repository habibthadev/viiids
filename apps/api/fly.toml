# Fly.io config for the viiids Go API.
# First deploy: fly launch --no-deploy (accepts this file), then fly deploy.
# Needs a unique app name — change viiids-api below if taken.

app = 'viiids-api'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      grace_period = '15s'
      interval = '30s'
      method = 'GET'
      path = '/api/health'
      timeout = '10s'

[env]
  PORT = '8080'
